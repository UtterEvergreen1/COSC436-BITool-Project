# COSC 436 BI Tool: PostgreSQL warehouse + Metabase.
# Values come from .env (copy .env.example to .env first).
services:
  warehouse:
    image: postgres:16
    container_name: dw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dw_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dw_password}
      POSTGRES_DB: ${POSTGRES_DB:-trading_dw}
    ports:
      # Host port 5433 -> container port 5432. Bound to localhost only.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dw-data:/var/lib/postgresql/data
      # SQL scripts are visible inside the container at /sql (read-only),
      # so they can be run with: docker compose exec warehouse psql ... -f /sql/<file>
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:${METABASE_VERSION:-latest}
    container_name: metabase
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  dw-data:
  metabase-data:
