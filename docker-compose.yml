services:
  warehouse:
    image: postgres:16
    container_name: dw-postgres
    environment:
      POSTGRES_USER: dw_admin
      POSTGRES_PASSWORD: dw_password
      POSTGRES_DB: trading_dw
    ports:
      - "5433:5432"
    volumes:
      - dw-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_admin -d trading_dw"]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  dw-data:
  metabase-data: